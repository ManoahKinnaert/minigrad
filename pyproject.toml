[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minigrad"
version = "0.1.0"
description = "A mini deep learning library for learning purposes."
requires-python = ">=3.13"
dependencies = [
    "numpy",
]

[tool.setuptools.packages.find]
include = ["minigrad*"]

[tool.coverage.run]
omit = [
    "*/__init__.py",
]